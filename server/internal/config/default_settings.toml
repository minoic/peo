############################
#Basic Settings
############################
# hostname to visit your web site
WebHostName = "http://example.com"
# website name to show
WebApplicationName = "PEO"
# website description to show
WebDescription = "Pterodactyl Account Menager"
# website Admin address
WebAdminAddress = "ADMIN <admin@example.com>"

############################
#Pterodactyl Settings
############################
# your pterodactyl panel hostname
PterodactylHostname = "https://pterodactyl.example.com"
# pterodactyl admin token
PterodactylToken = ""

############################
#Application Settings
############################
DatabaseSalt = "PEOSALT"
RedisHost = "redis:6379"
RedisPassword = ""
RedisDB = 0

############################
#API Settings
############################
# HMAC key used to sign the bearer tokens handed to the Flutter client.
# Leave empty to fall back to the legacy built-in key.
JWTSecret = ""
# Comma separated list of browser origins allowed to call the API, e.g.
# http://localhost:8080,https://panel.example.com . "*" allows every origin.
CORSOrigins = "*"
# Exact browser origins allowed to open the proxied console WebSocket.
ConsoleOrigins = ""
# Directory served as the compiled Flutter web application.
WebRoot = "web"

############################
#SMTP settings
############################
# if set to false, we wont send any email to user
SMTPEnabled = false
SMTPHost = "smtpdm-ap-southeast-1.aliyun.com"
SMTPPort = 80
SMTPSendFrom = "ADMIN <admin@example.com>"
SMTPUsername = "admin@example.com"
SMTPUserPassword = "yourpassword"
#TLS/SSL
SMTPEncryption = "TLS"
# if DeleteEmailConfirm be set to true all admins will receive an email before Server being deleted
DeleteEmailConfirm = true

############################
#Misc Settings
############################
# check if you want user to recharge balance
RechargeMode = false
# if set to false, we wont accept any discount
TotalDiscount = false
# fill if you want to enable alipay recharge
AliPayEnabled = false
AliPayPublicKey = ""
AliPayPrivateKey = ""
AliPayAppID = ""
# toggle album
AlbumEnabled = false
SocialLink = "https://github.com/minoic/peo"
SocialLinkTitle = "GitHub"
